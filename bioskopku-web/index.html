          <!-- Anti-Popup & Anti-Judol Window Guard -->
    <script>
      (function() {
        // Prevent all unwanted popup windows without breaking video iframes
        const origOpen = window.open;
        window.open = function(url, target, features) {
          if (!url) return null;
          const u = String(url).toLowerCase();
          const isAllowed = u.includes('youtube.com') || 
                            u.includes('themoviedb.org') || 
                            u.includes('tmdb.org') || 
                            u.includes('ruangsinema') || 
                            u.includes('vercel.app') || 
                            u.includes('localhost') ||
                            u.includes('multiembed') ||
                            u.includes('vidlink') ||
                            u.includes('vidsrc');
          if (!isAllowed) {
            console.warn('[RuangSinema Shield] Blocked unauthorized ad / judol window:', url);
            return null;
          }
          return origOpen.apply(this, arguments);
        };
      })();
    </script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="50%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Crimson Flame Neon Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38"/>
      <stop offset="45%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#990008"/>
    </linearGradient>

    <!-- Gold Accent Glow -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <!-- Glass Highlight -->
    <linearGradient id="glassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E50914" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#333333" stroke-width="6"/>
  
  <!-- Subtle Ambient Glow Behind Logo -->
  <circle cx="256" cy="256" r="160" fill="#E50914" opacity="0.12" filter="blur(30px)"/>

  <!-- Modern Cinema Reel & Clapper Polygon Shape -->
  <g filter="url(#glow)">
    <!-- Main Crimson Play Clapper Shield -->
    <path d="M140 130 C140 110, 160 98, 178 108 L386 234 C404 245, 404 267, 386 278 L178 404 C160 414, 140 402, 140 382 Z" fill="url(#neonRed)"/>
    
    <!-- Geometric Film Strip Slits -->
    <path d="M165 145 L205 145 L185 205 L145 205 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M225 145 L265 145 L245 205 L205 205 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M285 145 L325 145 L305 205 L265 205 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- Center Play Core Cutout / Diamond Triangle -->
    <polygon points="230,210 320,256 230,302" fill="#FFFFFF"/>
    
    <!-- Cinema Sparkle Star -->
    <path d="M370 120 Q390 120 390 100 Q390 120 410 120 Q390 120 390 140 Q390 120 370 120 Z" fill="url(#goldGlow)"/>
  </g>

  <!-- Top Glass Highlight Rim -->
  <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#glassLight)"/>
</svg>